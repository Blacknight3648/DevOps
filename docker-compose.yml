version: '3.8'

services:
  db-ventas:
    image: postgres:15-alpine
    container_name: db-innovatech-ventas
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT_VENTAS}:5432"
    volumes:
      - db_data_ventas:/var/lib/postgresql/data
    networks:
      - red-backend

  db-despacho:
    image: postgres:15-alpine
    container_name: db-innovatech-despacho
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT_DESPACHOS}:5432"
    volumes:
      - db_data_despacho:/var/lib/postgresql/data
    networks:
      - red-backend

  ventas-service:
    build: ./backend/Springboot-API-REST-VENTAS
    image: ${DOCKERHUB_USERNAME}/backend-ventas:latest
    container_name: api-ventas-innovatech
    restart: always
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db-ventas:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    ports:
      - "${VENTAS_PORT}:8081"
    depends_on:
      - db-ventas
    networks:
      - red-backend

  despachos-service:
    build: ./backend/Springboot-API-REST-DESPACHO
    image: ${DOCKERHUB_USERNAME}/backend-despachos:latest
    container_name: api-despachos-innovatech
    restart: always
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db-despacho:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    ports:
      - "${DESPACHOS_PORT}:8082"
    depends_on:
      - db-despacho
    networks:
      - red-backend

  frontend:
    build: ./frontend/front_despacho
    image: ${DOCKERHUB_USERNAME}/frontend-innovatech:latest
    container_name: frontend
    restart: always
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - ventas-service
      - despachos-service
    networks:
      - red-backend

volumes:
  db_data_ventas:
  db_data_despacho:

networks:
  red-backend:
    driver: bridge
