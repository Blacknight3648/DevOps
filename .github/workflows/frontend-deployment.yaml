name: Build and Push Frontend to ECR

on:
  push:
    branches:
      - deploy
    paths:
      - 'frontend/front_despacho/**'
      - '.github/workflows/frontend-deployment.yaml'

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPO_FRONTEND: ${{ vars.ECR_REPO_FRONTEND }}
  IMAGE_TAG: latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} # Necesario en cuentas de laboratorio de AWS (ej. AWS Academy)
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image - Frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: docker build -t $ECR_REGISTRY/$ECR_REPO_FRONTEND:$IMAGE_TAG ./frontend/front_despacho

      - name: Push Docker image - Frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: docker push $ECR_REGISTRY/$ECR_REPO_FRONTEND:$IMAGE_TAG
