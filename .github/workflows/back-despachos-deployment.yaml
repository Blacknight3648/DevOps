name: Build and Push Despachos to ECR

on:
  push:
    branches:
      - deploy
    paths:
      - 'backend/Springboot-API-REST-DESPACHO/**'
      - '.github/workflows/back-despachos-deployment.yaml'

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPO_DB_DESPACHOS: ${{ vars.ECR_REPO_DB_DESPACHOS }}
  ECR_REPO_DESPACHOS: ${{ vars.ECR_REPO_DESPACHOS }}
  IMAGE_TAG: latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} # Necesario en cuentas de laboratorio de AWS (ej. AWS Academy)
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull and Tag Docker image - DB Despachos
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker pull postgres:15-alpine
          docker tag postgres:15-alpine $ECR_REGISTRY/$ECR_REPO_DB_DESPACHOS:$IMAGE_TAG

      - name: Build Docker image - Despachos
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: docker build -t $ECR_REGISTRY/$ECR_REPO_DESPACHOS:$IMAGE_TAG ./backend/Springboot-API-REST-DESPACHO

      - name: Push Docker image - DB Despachos
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: docker push $ECR_REGISTRY/$ECR_REPO_DB_DESPACHOS:$IMAGE_TAG

      - name: Push Docker image - Despachos
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: docker push $ECR_REGISTRY/$ECR_REPO_DESPACHOS:$IMAGE_TAG
